[package]
name = "emissary-cli"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
description.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
arboard = "3"
axum = { version = "0.8.4", default-features = false, features = ["ws", "macros", "tokio", "http1"], optional = true }
clap = { workspace = true, features = ["derive"] }
emissary-core = { path = "../emissary-core", version = "0.4.0" }
emissary-util = { path = "../emissary-util", version = "0.4.0", features = ["tokio"] }
futures = "0.3.31"
httparse = "1.10.1"
serde_json = { version = "1.0.140", optional = true }
thiserror = "2.0.12"
tokio-tungstenite = { version = "0.27.0", default-features = false, features = ["native-tls"], optional = true }
url = "2.5.4"

scraper = { version = "0.21", optional = true }
ego-tree = { version = "0.9", optional = true }

# i2pcontrol dependencies
async-trait = { version = "0.1", optional = true }
http = { version = "1", optional = true }
hyper = { version = "1.6", default-features = false, features = ["http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto", "http1"], optional = true }
rcgen = { version = "0.13", optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
tower = { version = "0.5", default-features = false, optional = true }
tower-http = { version = "0.6", default-features = false, features = ["limit"], optional = true }

# workspace dependencies
anyhow = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true, features = ["log"] }
yosemite = { workspace = true }
dioxus = { version = "=0.7.3", optional = true }
dioxus-core = { version = "=0.7.3", optional = true }
dioxus-liveview = { version = "=0.7.3", features = ["axum"], optional = true }

[dev-dependencies]
fast-socks5 = { version = "1.0.0", features = ["socks4"] }
reqwest = { version = "0.12.21", default-features = false, features = ["rustls-tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[features]
default = ["ui"]
ui = ["dioxus/desktop", "dioxus/liveview", "dioxus-liveview", "axum"]
i2pcontrol = ["axum", "axum/json", "http", "hyper", "hyper-util", "serde_json", "rcgen", "rustls-pemfile", "tokio-rustls", "tower", "tower-http", "async-trait"]
metrics = ["emissary-util/metrics"]
